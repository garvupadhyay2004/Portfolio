<!--
  HOW TO USE THIS TEMPLATE
  1. Duplicate this file and rename it, e.g. "synaptiq-build-notes.html".
  2. Fill in the <title>, the post-date/title/meta in the header, and the cover image path.
  3. Write your post inside .post-body — use <h2> for section headings, <p> for paragraphs,
     and copy the <figure> block anywhere you want to drop in an image with a caption.
  4. Put any images in blog/assets/ and point the <img src="..."> tags at them.
  5. Add a matching <article class="post-card"> entry in blog/index.html so it shows up
     in the list (copy an existing one and update the href, thumbnail, date, title, excerpt).
-->
<!DOCTYPE html>
<html lang="en">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>POST TITLE — Gaurav Upadhyay</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../styles.css" />
<link rel="stylesheet" href="../blog.css" />
</head>
<body>

<header class="nav">
  <div class="nav-inner">
    <a href="../../index.html" class="brand">
      <span class="brand-mark">GU</span>
      <span class="brand-name">GAURAV UPADHYAY</span>
    </a>
    <nav class="nav-links">
      <a href="../../index.html#work">Work</a>
      <a href="../../index.html#experience">Experience</a>
      <a href="../../index.html#skills">Skills</a>
      <a href="../../index.html#about">About</a>
      <a href="../index.html" class="nav-cta">Blog</a>
    </nav>
    <button id="themeToggle" class="theme-toggle" aria-label="Toggle light and dark theme">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="5"></circle>
        <path d="M12 1v2M12 21v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M1 12h2M21 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"/>
      </svg>

    <button id="navToggle" class="nav-toggle" aria-label="Open menu">
      <span></span><span></span><span></span>
    </button>
  </div>
</header>

<main>
  <article>
    <header class="post-header">
      <span class="post-date">MONTH YEAR · Where this happened</span>
      <h1>POST TITLE</h1>
      <p class="post-meta">Role or context · read time</p>
    </header>

    <div class="post-cover">
      <img src="../../assets/blog/YOUR-COVER-IMAGE.jpg" alt="" onerror="this.closest('.post-cover').style.display='none'" />
    </div>

    <div class="post-body">
      <p>Opening paragraph.</p>

      <h2>A section heading</h2>
      <p>More content.</p>

      <figure>
        <img src="../../assets/blog/YOUR-IMAGE.jpg" alt="" onerror="this.closest('figure').style.display='none'" />
        <figcaption>Optional caption for the image above.</figcaption>
      </figure>
    </div>

    <div class="post-back">
      <a href="../index.html">← Back to all posts</a>
    </div>
  </article>
</main>

<footer class="footer">
  <span>© <span id="year"></span> Gaurav Upadhyay</span>
  <a href="../../index.html">← Back to portfolio</a>
  <span>Built around real data</span>
</footer>

<script src="../../script.js"></script>
</body>
</html>
